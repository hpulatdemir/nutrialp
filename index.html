<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NutriAlp</title>
  <meta name="description" content="NutriAlp — Alp'in bağırsak ormanı macerası.">
  <style>
    :root {
      --bg: #f6f8f4;
      --text: #1d2a1f;
      --muted: #5b6b5e;
      --accent: #2f7d4f;
      --card: #ffffff;
      --border: #dfe6dc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111713;
        --text: #e8efe9;
        --muted: #9fb1a3;
        --accent: #5cc285;
        --card: #18211b;
        --border: #2a362d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 48px 16px 64px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 6vw, 3rem);
      color: var(--accent);
    }
    p.lead {
      margin: 0 0 32px;
      color: var(--muted);
      font-size: 1.125rem;
    }
    .video-card {
      width: fit-content;
      max-width: 100%;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
    }
    video {
      display: block;
      max-width: 100%;
      max-height: max(320px, calc(100vh - 230px));
      max-height: max(320px, calc(100svh - 230px));
      width: auto;
      height: auto;
      margin: 0 auto;
      border-radius: 10px;
      background: #000;
    }
    footer {
      margin-top: 40px;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h1>NutriAlp</h1>
    <p class="lead">Alp'in bağırsak ormanı macerası.</p>

    <div class="video-card">
      <video controls preload="metadata" playsinline>
        <source src="nutrialp-sesli-video.mp4" type="video/mp4">
        Tarayıcınız video oynatmayı desteklemiyor.
      </video>
    </div>

    <footer>© 2026 NutriAlp</footer>
  </main>
</body>
</html>
